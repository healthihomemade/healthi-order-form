<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Other Homemade — Healthy Homemade</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --parchment: #f2ead8;
    --forest: #2d5a27;
    --forest-light: #3d7a35;
    --gold: #c8962a;
    --gold-light: #e8b84b;
    --dark: #1a1208;
    --text: #2c1f0e;
    --muted: #6b5640;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* HERO */
  .hero {
    background: linear-gradient(160deg, #1e3d1a 0%, #2d5a27 40%, #3a4a1a 100%);
    padding: 12px 20px;
    text-align: center;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }

  /* TAGLINE */
  .tagline {
    text-align: center;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    padding: 14px 20px 4px;
    max-width: 420px;
    margin: 0 auto;
  }

  /* ITEMS */
  .items-wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px 100px; }

  .item-card {
    background: var(--parchment);
    border: 1px solid rgba(200,150,42,0.25);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item-info { flex: 1; }
  .item-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .item-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }
  .item-note {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
    line-height: 1.4;
  }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1.5px solid rgba(200,150,42,0.4);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .qty-btn {
    background: rgba(200,150,42,0.12);
    border: none;
    width: 34px;
    height: 34px;
    font-size: 20px;
    font-weight: 300;
    color: var(--forest);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    line-height: 1;
  }
  .qty-btn:hover { background: rgba(200,150,42,0.28); }
  .qty-val {
    min-width: 36px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    border-left: 1px solid rgba(200,150,42,0.3);
    border-right: 1px solid rgba(200,150,42,0.3);
    padding: 0 4px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* FLOATING PILL */
  .total-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    display: flex;
    align-items: center;
    gap: 0;
    background: linear-gradient(135deg, #1e3d1a, #2d5a27);
    border: 1px solid rgba(200,150,42,0.5);
    border-radius: 50px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.35);
    z-index: 100;
    overflow: hidden;
    white-space: nowrap;
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
    pointer-events: none;
  }
  .total-bar.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: all;
  }
  .pill-total {
    padding: 11px 18px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .pill-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .pill-amt {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--gold-light);
  }
  .pill-divider { width: 1px; background: rgba(255,255,255,0.15); align-self: stretch; }
  .place-btn {
    background: var(--gold);
    color: var(--dark);
    border: none;
    padding: 11px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .place-btn:hover { background: var(--gold-light); }
  .clear-btn {
    background: none;
    border: none;
    border-left: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.45);
    padding: 11px 14px;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .clear-btn:hover { color: #fff; }

  /* ORDER MODAL */
  .order-modal-overlay {
    position: fixed; inset: 0; background: rgba(26,18,8,0.7);
    backdrop-filter: blur(4px); z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .order-modal-overlay.visible { opacity: 1; pointer-events: all; }
  .order-modal {
    background: var(--cream); border-radius: 12px; max-width: 420px; width: 100%;
    max-height: 80vh; overflow-y: auto; padding: 28px 24px;
    transform: scale(0.92); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  .order-modal-overlay.visible .order-modal { transform: scale(1); }
  .order-modal h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; color: var(--forest); margin-bottom: 14px; }
  .order-summary-line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(200,150,42,0.15); font-size: 14px; color: var(--text); }
  .order-summary-total { display: flex; justify-content: space-between; padding: 10px 0 0; font-size: 16px; font-weight: 700; color: var(--forest); }
  .email-field { margin-top: 18px; }
  .email-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .email-input { width: 100%; padding: 11px 14px; border: 1.5px solid rgba(200,150,42,0.35); border-radius: 6px; font-family: 'Lato', sans-serif; font-size: 15px; color: var(--text); background: var(--parchment); outline: none; transition: border-color 0.2s; }
  .email-input:focus { border-color: var(--gold); }
  .order-modal-footer { display: flex; gap: 10px; margin-top: 18px; }
  .order-modal-footer .place-btn { flex: 1; border-radius: 8px; }
  .modal-close-btn { background: var(--parchment); border: 1px solid rgba(200,150,42,0.3); color: var(--muted); padding: 11px 18px; font-family: 'Lato', sans-serif; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
  .modal-close-btn:hover { background: rgba(200,150,42,0.1); color: var(--text); }

  /* FOOTER */
  .footer { background: var(--forest); text-align: center; padding: 16px 16px 20px; color: rgba(255,255,255,0.6); font-size: 14px; }
  .footer-call-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #22c55e; color: #fff; border-radius: 30px;
    padding: 10px 24px; font-size: 15px; font-weight: 700;
    text-decoration: none; margin-bottom: 10px;
    transition: background 0.2s, transform 0.2s;
  }
  .footer-call-btn:hover { background: #1ebe5d; transform: translateY(-2px); }
  .footer p { font-size: 13px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<header class="hero">
  <h1>Other Homemade</h1>
</header>

<p class="tagline">"All the items are 100% homemade with traditional ingredients"</p>

<div class="items-wrap" id="itemsWrap"></div>

<footer class="footer">
  <a href="tel:+16476073961" class="footer-call-btn">📞 Call (647) 607-3961</a>
  <p>Healthy Homemade · All vegetarian · Prices may vary</p>
</footer>

<div class="total-bar" id="totalBar">
  <div class="pill-total">
    <span class="pill-label">Total</span>
    <span class="pill-amt" id="pillAmt">$0</span>
  </div>
  <div class="pill-divider"></div>
  <button class="place-btn" onclick="openOrderModal()">📧 Order</button>
  <button class="clear-btn" onclick="clearAll()">✕</button>
</div>

<div class="order-modal-overlay" id="orderModalOverlay" onclick="closeOrderModal(event)">
  <div class="order-modal">
    <h2>Your Order</h2>
    <div id="orderSummary"></div>
    <div class="email-field">
      <label class="email-label">Your Email (for receipt)</label>
      <input type="email" id="customerEmail" class="email-input" placeholder="you@example.com">
    </div>
    <div class="order-modal-footer">
      <button class="place-btn" onclick="placeOrder()">📧 Place Order</button>
      <button class="modal-close-btn" onclick="closeOrderModal()">Close</button>
    </div>
  </div>
</div>

<script>
const ITEMS = [
  { id: 'tadka',     name: 'Tadka',        note: 'Customizable as per need — Jain / Without Onion Garlic',                              rate: 10, unit: 'lb' },
  { id: 'gondh',     name: 'Gondh Laddu',  note: 'Nuts and without nuts option available',                                               rate: 17, unit: 'lb' },
  { id: 'panjeeri',  name: 'Panjeeri',     note: 'Special for expecting mothers',                                                        rate: 17, unit: 'lb' },
  { id: 'gajjar',    name: 'Gajjar Halwa', note: 'With nuts and without nuts · Dairy free option also available',                        rate: 15, unit: 'lb' },
  { id: 'desi-ghee', name: 'Desi Ghee',    note: '100% pure — Prepared in traditional style with butter',                               rate: 20, unit: 'lb' },
];

const qty = {};
ITEMS.forEach(it => qty[it.id] = 0);

function render() {
  const wrap = document.getElementById('itemsWrap');
  wrap.innerHTML = '';
  ITEMS.forEach(it => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.innerHTML = `
      <div class="item-info">
        <div class="item-name">${it.name}</div>
        <div class="item-price">$${it.rate} / ${it.unit}</div>
        ${it.note ? `<div class="item-note">${it.note}</div>` : ''}
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="change('${it.id}',-1)">−</button>
        <div class="qty-val" id="qty-${it.id}">${qty[it.id]}</div>
        <button class="qty-btn" onclick="change('${it.id}',1)">+</button>
      </div>`;
    wrap.appendChild(card);
  });
  updateTotal();
}

function change(id, delta) {
  qty[id] = Math.max(0, qty[id] + delta);
  document.getElementById('qty-' + id).textContent = qty[id];
  updateTotal();
}

function updateTotal() {
  const bar = document.getElementById('totalBar');
  let total = 0;
  ITEMS.forEach(it => { total += qty[it.id] * it.rate; });
  if (total > 0) {
    document.getElementById('pillAmt').textContent = '$' + total.toFixed(2);
    bar.classList.add('visible');
  } else {
    bar.classList.remove('visible');
  }
}

function clearAll() {
  ITEMS.forEach(it => { qty[it.id] = 0; document.getElementById('qty-' + it.id).textContent = 0; });
  updateTotal();
}

function openOrderModal() {
  let html = '';
  let total = 0;
  ITEMS.forEach(it => {
    if (qty[it.id] > 0) {
      const amt = qty[it.id] * it.rate;
      total += amt;
      html += `<div class="order-summary-line"><span>${it.name} × ${qty[it.id]} lb</span><span>$${amt.toFixed(2)}</span></div>`;
    }
  });
  html += `<div class="order-summary-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>`;
  document.getElementById('orderSummary').innerHTML = html;
  document.getElementById('customerEmail').value = '';
  document.getElementById('orderModalOverlay').classList.add('visible');
}

function closeOrderModal(e) {
  if (!e || e.target === document.getElementById('orderModalOverlay'))
    document.getElementById('orderModalOverlay').classList.remove('visible');
}

function placeOrder() {
  let lines = ['Other Homemade Order — Healthy Homemade\n'];
  let total = 0;
  ITEMS.forEach(it => {
    if (qty[it.id] > 0) {
      const amt = qty[it.id] * it.rate;
      total += amt;
      lines.push(`  • ${it.name} — ${qty[it.id]} lb × $${it.rate} = $${amt.toFixed(2)}`);
    }
  });
  lines.push('');
  lines.push('─────────────────────────');
  lines.push(`Total: $${total.toFixed(2)}`);
  lines.push('');
  lines.push('Please confirm availability and delivery.');
  const subject = 'Homemade Order — Healthy Homemade';
  const bodyText = lines.join('\n');
  const customerEmail = document.getElementById('customerEmail').value || '';
  let mailto = 'mailto:healthihomemade@gmail.com';
  if (customerEmail) mailto += '?cc=' + encodeURIComponent(customerEmail) + '&subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyText);
  else mailto += '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyText);
  window.location.href = mailto;
}

render();
</script>
</body>
</html>
